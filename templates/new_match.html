{% extends "base.html" %}{% block title %}Novo jogo{% endblock %}{% block content %}<div class="panel"><h2>Cadastrar jogo — {{c.name}}</h2>{% if teams|length < 2 %}<p>É necessário ter pelo menos duas equipes aprovadas.</p>{% else %}<form method="post"><div><label>Fase / rodada</label><input name="round_name" placeholder="Ex.: Grupo A - 1ª rodada"></div><div><label>Data e horário</label><input type="datetime-local" name="match_date"></div><div><label>Local</label><input name="venue"></div><div class="row"><div><label>Equipe mandante</label><select name="home_team">{% for t in teams %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></div><div><label>Equipe visitante</label><select name="away_team">{% for t in teams %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select></div></div><button class="btn">Criar jogo</button></form>{% endif %}</div>{% endblock %}
