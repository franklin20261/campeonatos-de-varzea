{% extends "base.html" %}{% block title %}Novo campeonato{% endblock %}{% block content %}<div class="panel"><h2>Cadastrar campeonato</h2><form method="post"><div><label>Nome do campeonato</label><input name="name" required></div><div class="row"><div><label>Cidade</label><input name="city" required></div><div><label>Estado (UF)</label><input name="state" maxlength="2" placeholder="PI" required></div><div><label>Ano</label><input type="number" name="year" value="2026" required></div></div><div><label>Premiação</label><input name="prize" placeholder="Ex.: troféu e premiação em dinheiro"></div><div><label>Regulamento / descrição</label><textarea name="description"></textarea></div><div><label>Status</label><select name="status"><option>Inscrições abertas</option><option>Em andamento</option><option>Encerrado</option></select></div><button class="btn">Salvar campeonato</button></form></div>{% endblock %}
