{% extends "base.html" %}{% block title %}Inscrever equipe{% endblock %}{% block content %}<div class="panel"><h2>Inscrever equipe em {{c.name}}</h2><form method="post" enctype="multipart/form-data"><div><label>Nome da equipe</label><input name="name" required></div><div><label>Cidade da equipe</label><input name="city"></div><div><label>Escudo (opcional)</label><input type="file" name="shield" accept=".jpg,.jpeg,.png,.webp"></div><h3>Jogadores</h3><p class="muted">Adicione os atletas. Fotos e documentos são opcionais nesta versão de teste.</p><div id="players"><div class="player"><div><label>Nome do jogador</label><input name="player_name[]" required></div><div class="row"><div><label>Nascimento</label><input type="date" name="birth_date[]"></div><div><label>Posição</label><input name="position[]" placeholder="Goleiro, zagueiro..."></div><div><label>Camisa</label><input type="number" name="shirt_number[]" min="1" max="99"></div></div><div class="row"><div><label>Foto</label><input type="file" name="photo_0" accept=".jpg,.jpeg,.png,.webp"></div><div><label>Documento (PDF ou imagem)</label><input type="file" name="document_0" accept=".jpg,.jpeg,.png,.webp,.pdf"></div></div></div></div><button type="button" class="btn secondary" onclick="addPlayer()">+ Adicionar jogador</button><button class="btn">Enviar inscrição para aprovação</button></form></div><script>let n=1;function addPlayer(){const d=document.createElement('div');d.className='player';d.innerHTML=`<div><label>Nome do jogador</label><input name="player_name[]" required></div><div class="row"><div><label>Nascimento</label><input type="date" name="birth_date[]"></div><div><label>Posição</label><input name="position[]"></div><div><label>Camisa</label><input type="number" name="shirt_number[]" min="1" max="99"></div></div><div class="row"><div><label>Foto</label><input type="file" name="photo_${n}" accept=".jpg,.jpeg,.png,.webp"></div><div><label>Documento</label><input type="file" name="document_${n}" accept=".jpg,.jpeg,.png,.webp,.pdf"></div></div>`;document.getElementById('players').appendChild(d);n++}</script>{% endblock %}
