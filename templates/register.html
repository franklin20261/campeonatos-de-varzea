{% extends "base.html" %}{% block title %}Criar conta{% endblock %}{% block content %}<div class="panel" style="max-width:540px;margin:auto"><h2>Criar conta</h2><p class="muted">Cadastre-se como técnico ou organizador. O cadastro de equipes é feito pelo técnico ou organizador.</p><form method="post"><div><label>Nome completo</label><input name="name" required></div><div><label>E-mail</label><input type="email" name="email" required></div><div><label>Senha (mínimo 8 caracteres)</label><input type="password" name="password" minlength="8" required></div><div><label>Tipo de conta</label><select name="role"><option value="tecnico">Técnico de equipe</option><option value="organizador">Organizador de campeonato</option></select></div><button class="btn">Criar conta</button></form></div>{% endblock %}
